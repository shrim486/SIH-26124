name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      SECRET_KEY: ci-only-test-secret-not-for-deployment
      GOVERNMENT_USERNAME: ci-user
      GOVERNMENT_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s edge_ai/tests -p 'test_*.py'
      - run: python -m pytest tests -q
        working-directory: backend
  portals:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [user_portal, government_portal]
    defaults:
      run:
        working-directory: ${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.portal }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
